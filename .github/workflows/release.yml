name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  # ==================== Build Windows ====================
  build-windows:
    name: Build Windows (.msi)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install frontend deps
        run: npm ci

      - name: Build Tauri
        run: npm run tauri build
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_KEY_PASSWORD }}

      - name: Upload Windows Installer
        uses: actions/upload-artifact@v4
        with:
          name: installer-windows
          path: src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: error

  # ==================== Build macOS ====================
  build-macos:
    name: Build macOS (.dmg)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install frontend deps
        run: npm ci

      - name: Build Tauri
        run: npm run tauri build
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_KEY_PASSWORD }}

      - name: Upload macOS Installer
        uses: actions/upload-artifact@v4
        with:
          name: installer-macos
          path: src-tauri/target/release/bundle/dmg/*.dmg
          if-no-files-found: error

  # ==================== Create GitHub Release ====================
  release:
    name: Create Release
    needs: [build-windows, build-macos]
    runs-on: ubuntu-latest
    steps:
      - name: Download Windows Installer
        uses: actions/download-artifact@v4
        with:
          name: installer-windows
          path: dist

      - name: Download macOS Installer
        uses: actions/download-artifact@v4
        with:
          name: installer-macos
          path: dist

      - name: Generate Checksums
        run: |
          cd dist
          sha256sum * > checksums.txt
          cat checksums.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "DuLog ${{ github.ref_name }}"
          body: |
            ## DuLog · 大日志检索工具

            **${{ github.ref_name }}** — 跨平台大日志文件查询工具

            ### 核心特性
            - **超大文件友好**：本地 mmap + 虚拟滚动，90GB 日志秒开
            - **SSH 远程模式**：密码/密钥/ssh-agent 三种认证，浏览远程目录并检索
            - **类 Notepad++ 编辑器**：Tab 缩进、自动缩进、Ctrl+S 保存
            - **流式检索**：正则/纯文本 + 忽略大小写 + 命中高亮
            - **轻量安装包**：仅数 MB（远小于 Electron 方案）

            ### 安装
            | 平台 | 文件 | 方式 |
            |------|------|------|
            | Windows | `.msi` | 双击安装 |
            | macOS | `.dmg` | 拖入 Applications |
            | Linux | 从源码构建 | `npm run tauri build` |

            ### 校验
            ```sh
            # Windows (PowerShell)
            Get-FileHash dulog_*.msi -Algorithm SHA256

            # macOS
            shasum -a 256 dulog_*.dmg
            ```
          files: |
            dist/*.msi
            dist/*.dmg
            dist/checksums.txt
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
