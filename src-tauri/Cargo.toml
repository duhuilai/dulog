[package]
name = "dulog"
version = "0.1.6"
edition = "2021"
description = "大日志检索工具：本地 mmap + SSH 远程，支持超大文件与高亮"
authors = ["dulog"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1"
memmap2 = "0.9"
tokio = { version = "1", features = ["full"] }
async-trait = "0.1"
russh = "0.45"
russh-keys = "0.45"
reqwest = { version = "0.12", features = ["json", "stream"] }
futures-util = "0.3"
dirs-next = "2"
